<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carcassonne - Avance</title>
    <link rel="icon" type="image/png" href="../img/favicon-c.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .page-shell {
            min-height: 100svh;
            padding: 1rem !important;
            background: #f8f9fa;
        }

        .avance-layout {
            min-height: calc(100svh - 2rem);
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 1rem;
        }

        .cards-section {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 1rem;
            padding: 1rem;
        }

        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
        }

        .image-section {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 1rem;
            background: #f8f9fa;
        }

        #mapa {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center center;
            object-fit: contain;
        }
        #mapa.rotada {
            transform: translate(-50%, -50%) rotate(90deg);
        }

        .ficha-jugador {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.45);
            transform: translate(-50%, -50%);
            z-index: 10;
            animation: pulsoFicha 1.6s ease-in-out infinite;
        }
        @keyframes pulsoFicha {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%       { transform: translate(-50%, -50%) scale(1.2); }
        }
        .player-card-avance {
            border: 1px solid rgba(15,23,42,.12);
            border-radius: 2rem;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 8px rgba(15,23,42,.07);
            display: flex;
            align-items: center;
            gap: .4rem;
            padding: .3rem .75rem .3rem .4rem;
            white-space: nowrap;
        }
       
        .player-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--color);
            border: 1px solid rgba(0,0,0,.15);
            flex-shrink: 0;
        }
        .player-name {
            flex: 1;
            font-weight: 600;
            font-size: .9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-pts {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3a8a;
        }
        .player-vueltas {
            font-size: .8rem;
            font-weight: 600;
            color: #64748b;
        }

        #micBtn.escuchando {
            background-color: #dc3545;
            border-color: #dc3545;
            color: #fff;
            animation: pulsoMic 1s ease-in-out infinite;
        }
        @keyframes pulsoMic {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.15); }
        }

        .voz-indicador {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 22px;
        }
        .voz-indicador span {
            display: inline-block;
            width: 4px;
            background: #dc3545;
            border-radius: 2px;
            animation: ondaVoz .9s ease-in-out infinite;
        }
        .voz-indicador span:nth-child(1) { animation-delay: 0s; }
        .voz-indicador span:nth-child(2) { animation-delay: .15s; }
        .voz-indicador span:nth-child(3) { animation-delay: .3s; }
        .voz-indicador span:nth-child(4) { animation-delay: .45s; }
        .voz-indicador span:nth-child(5) { animation-delay: .6s; }
        @keyframes ondaVoz {
            0%, 100% { height: 6px; }
            50%      { height: 22px; }
        }

        .voz-ejemplo {
            font-size: .8rem;
        }

        @media (max-width: 768px) {
            .page-shell {
                padding: .75rem !important;
            }

            .avance-layout {
                min-height: calc(100svh - 1.5rem);
            }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-3 px-3 px-md-4 page-shell">
        <div class="avance-layout">
            <section class="cards-section">
                <div class="mb-2">
                    <div class="d-flex align-items-center gap-3 flex-wrap">
                        <button class="btn btn-sm btn-outline-secondary" onclick="window.location.href='puntos.html'">
                            <i class="bi bi-arrow-left"></i> Volver
                        </button>
                        <button id="micBtn" class="btn btn-sm btn-outline-secondary" onclick="iniciarComandoVoz()" title="Comando de voz">
                            <i class="bi bi-mic-fill"></i>
                        </button>
                        <div id="vozIndicador" class="voz-indicador d-none" aria-hidden="true">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                    </div>
                    <small class="text-muted voz-ejemplo d-block mt-1">
                        Ejemplo: "Súmale 5 puntos a Felipe, ok" / "Quítale 3 puntos a María, ok"
                    </small>
                </div>
                <div class="cards-grid" id="cardsContainer"></div>
            </section>
            <section class="image-section">
                <img id="mapa" src="../img/mapaPuntos.png" alt="Mapa">
            </section>
        </div>
    </div>

    <script>
        const NAT_W = 1460;
        const NAT_H = 1014;

        const POSICIONES = [
            {x:1317,y:843},{x:1098,y:869},{x:959,y:854},{x:809,y:859},{x:677,y:852},
            {x:547,y:866},{x:409,y:871},{x:256,y:893},{x:117,y:834},{x:97,y:685},
            {x:90,y:563},{x:98,y:421},{x:96,y:292},{x:95,y:140},{x:216,y:89},
            {x:336,y:83},{x:452,y:75},{x:566,y:79},{x:678,y:89},{x:786,y:94},
            {x:899,y:95},{x:1006,y:87},{x:1119,y:97},{x:1218,y:84},{x:1364,y:80},
            {x:1395,y:199},{x:1359,y:306},{x:1223,y:333},{x:1124,y:317},{x:1028,y:324},
            {x:931,y:338},{x:831,y:329},{x:726,y:335},{x:612,y:326},{x:523,y:325},
            {x:423,y:317},{x:327,y:352},{x:294,y:446},{x:352,y:540},{x:450,y:578},
            {x:549,y:580},{x:647,y:520},{x:753,y:515},{x:853,y:548},{x:952,y:509},
            {x:1052,y:514},{x:1163,y:510},{x:1266,y:492},{x:1373,y:536},{x:1360,y:655}
        ];

        const STORAGE_KEY = 'partidaMesa';

        const OFFSETS = [
            {x:0,y:0},{x:20,y:0},{x:-20,y:0},{x:0,y:20},{x:0,y:-20},
            {x:20,y:20},{x:20,y:-20},{x:-20,y:20},{x:-20,y:-20}
        ];

        function obtenerJugadores() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? (JSON.parse(raw)?.jugadores ?? []) : [];
            } catch(e) { return []; }
        }

        function obtenerCasilla(puntos) {
            if (puntos < 0) return 0;
            return puntos % POSICIONES.length;
        }

        // ---- Comando de voz ----

        const NUMEROS_TEXTO = {
            uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5,
            seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10,
            once: 11, doce: 12, trece: 13, catorce: 14, quince: 15,
            dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20
        };

        const PALABRAS_RESTA = ['quita', 'resta', 'menos'];
        const MIC_PERMISO_KEY = 'vozPermisoConcedido';

        let recognition = null;
        let escuchando = false;

        // revisa si el microfono ya fue autorizado antes, para no volver a preguntar
        async function tienePermisoMicrofono() {
            if (localStorage.getItem(MIC_PERMISO_KEY) === 'true') {
                return true;
            }

            if (!navigator.permissions || !navigator.permissions.query) {
                return null; // no se puede saber de antemano, se intenta directo
            }

            try {
                const estado = await navigator.permissions.query({ name: 'microphone' });
                if (estado.state === 'granted') {
                    localStorage.setItem(MIC_PERMISO_KEY, 'true');
                    return true;
                }
                if (estado.state === 'denied') {
                    return false;
                }
                return null; // 'prompt': se pedira al iniciar el reconocimiento
            } catch (e) {
                return null;
            }
        }

        // pasa el texto a minusculas y le quita las tildes, para comparar sin importar acentos
        function normalizarTexto(texto) {
            return texto
                .toLowerCase()
                .normalize('NFD')
                .replace(/[̀-ͯ]/g, '')
                .trim();
        }

        // revisa si el texto transcrito ya incluye la palabra "ok"
        function contienePalabraOk(texto) {
            return /\bok\b/.test(normalizarTexto(texto));
        }

        // extrae el numero de puntos del texto, ya sea en digitos ("5") o en palabras ("cinco")
        function extraerNumero(texto) {
            const textoNormalizado = normalizarTexto(texto);

            const coincidenciaDigitos = textoNormalizado.match(/\d+/);
            if (coincidenciaDigitos) {
                return parseInt(coincidenciaDigitos[0], 10);
            }

            const palabras = textoNormalizado.split(/\s+/);
            for (const palabra of palabras) {
                if (NUMEROS_TEXTO[palabra] !== undefined) {
                    return NUMEROS_TEXTO[palabra];
                }
            }

            return null;
        }

        // busca cual jugador de la partida actual fue mencionado en el texto
        function extraerJugador(texto, jugadores) {
            const textoNormalizado = normalizarTexto(texto);
            return jugadores.find(j => textoNormalizado.includes(normalizarTexto(j.nombre))) || null;
        }

        // detecta si la frase pide restar puntos en vez de sumar
        function esResta(texto) {
            const textoNormalizado = normalizarTexto(texto);
            return PALABRAS_RESTA.some(palabra => textoNormalizado.includes(palabra));
        }

        // pinta el boton de microfono y el indicador de ondas segun si esta escuchando o no
        function actualizarBotonMic() {
            const boton = document.getElementById('micBtn');
            if (boton) boton.classList.toggle('escuchando', escuchando);

            const indicador = document.getElementById('vozIndicador');
            if (indicador) indicador.classList.toggle('d-none', !escuchando);
        }

        // aplica el cambio de puntos al jugador y lo persiste en localStorage (partidaMesa)
        function accionJugador(id, valor) {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;

            const data = JSON.parse(raw);
            const jugador = (data.jugadores || []).find(j => j.id === id);
            if (!jugador) return;

            jugador.puntos += valor;

            data.historial = data.historial || [];
            data.historial.unshift({
                fecha: new Date().toLocaleTimeString(),
                jugador: jugador.nombre,
                tipo: 'PUNTOS',
                valor
            });

            data.undoStack = data.undoStack || [];
            data.undoStack.push({
                jugadorId: jugador.id,
                tipo: 'PUNTOS',
                valor
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

            render();
        }

        // interpreta el texto escuchado y aplica los puntos al jugador correspondiente
        function procesarComandoVoz(textoOriginal) {
            console.log('Texto transcrito:', textoOriginal);

            const textoLimpio = textoOriginal.replace(/\bok\b/gi, ' ');
            const jugadores = obtenerJugadores();

            const jugador = extraerJugador(textoLimpio, jugadores);
            if (!jugador) {
                alert(`No se reconoció ningún jugador en el comando.\nTexto escuchado: "${textoOriginal.trim()}"`);
                return;
            }

            const numero = extraerNumero(textoLimpio);
            if (numero === null) {
                alert(`No se reconoció la cantidad de puntos en el comando.\nTexto escuchado: "${textoOriginal.trim()}"`);
                return;
            }

            const valorFinal = esResta(textoLimpio) ? -numero : numero;

            accionJugador(jugador.id, valorFinal);
        }

        // inicia la escucha del comando de voz para asignar puntos
        async function iniciarComandoVoz() {
            const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognitionAPI) {
                alert('El reconocimiento de voz no es compatible con este navegador. Usa Google Chrome o Microsoft Edge.');
                return;
            }

            if (escuchando) {
                recognition.stop();
                return;
            }

            const permiso = await tienePermisoMicrofono();
            if (permiso === false) {
                alert('El micrófono está bloqueado para esta página. Habilítalo desde la configuración del navegador para usar comandos de voz.');
                return;
            }

            recognition = new SpeechRecognitionAPI();
            recognition.lang = 'es-CO';
            recognition.continuous = true;
            recognition.interimResults = true;

            let transcritoAcumulado = '';

            recognition.onstart = () => {
                escuchando = true;
                localStorage.setItem(MIC_PERMISO_KEY, 'true'); // si arranca, el permiso ya quedo concedido
                actualizarBotonMic();
            };

            recognition.onresult = (evento) => {
                transcritoAcumulado = '';
                for (let i = 0; i < evento.results.length; i++) {
                    transcritoAcumulado += evento.results[i][0].transcript + ' ';
                }

                if (contienePalabraOk(transcritoAcumulado)) {
                    recognition.stop();
                }
            };

            recognition.onerror = (evento) => {
                console.error('Error de reconocimiento de voz:', evento.error);

                if (evento.error === 'not-allowed' || evento.error === 'service-not-allowed') {
                    localStorage.removeItem(MIC_PERMISO_KEY);
                }
            };

            recognition.onend = () => {
                escuchando = false;
                actualizarBotonMic();

                if (transcritoAcumulado.trim()) {
                    procesarComandoVoz(transcritoAcumulado);
                }
            };

            recognition.start();
        }

        const PANTALLA_GRANDE_QUERY = '(min-width: 992px)';

        // En pantallas grandes el mapa se muestra horizontal (sin rotar)
        function esPantallaGrande() {
            return window.matchMedia(PANTALLA_GRANDE_QUERY).matches;
        }

        function ajustarMapaMaximo() {
            const mapa = document.getElementById('mapa');
            const contenedor = document.querySelector('.image-section');
            if (!mapa || !contenedor || !mapa.naturalWidth) return;

            if (esPantallaGrande()) {
                mapa.classList.remove('rotada');
                const escala = Math.min(contenedor.clientWidth / NAT_W, contenedor.clientHeight / NAT_H);
                mapa.style.width  = `${NAT_W * escala}px`;
                mapa.style.height = `${NAT_H * escala}px`;
            } else {
                mapa.classList.add('rotada');
                const escala = Math.min(contenedor.clientWidth / NAT_H, contenedor.clientHeight / NAT_W);
                mapa.style.width  = `${NAT_W * escala}px`;
                mapa.style.height = `${NAT_H * escala}px`;
            }

            renderizarFichas();
        }

        // Convierte coordenadas originales (sin rotar) a posicion dentro de image-section
        function coordAPantalla(px, py) {
            const mapa = document.getElementById('mapa');
            const rMapa = mapa.getBoundingClientRect();
            const rCont = document.querySelector('.image-section').getBoundingClientRect();

            if (mapa.classList.contains('rotada')) {
                const x = (rMapa.left - rCont.left) + (1 - py / NAT_H) * rMapa.width;
                const y = (rMapa.top  - rCont.top)  + (px / NAT_W) * rMapa.height;
                return { x, y };
            }

            const x = (rMapa.left - rCont.left) + (px / NAT_W) * rMapa.width;
            const y = (rMapa.top  - rCont.top)  + (py / NAT_H) * rMapa.height;
            return { x, y };
        }

        function renderizarFichas() {
            const contenedor = document.querySelector('.image-section');
            contenedor.querySelectorAll('.ficha-jugador').forEach(el => el.remove());

            const jugadores = obtenerJugadores();
            const casillasEnUso = [];

            jugadores.forEach(j => {
                const casilla = obtenerCasilla(j.puntos);
                casillasEnUso.push(casilla);
                const indice = casillasEnUso.filter(c => c === casilla).length - 1;
                const { x, y } = coordAPantalla(POSICIONES[casilla].x, POSICIONES[casilla].y);
                const off = OFFSETS[Math.min(indice, OFFSETS.length - 1)];

                const div = document.createElement('div');
                div.className = 'ficha-jugador';
                div.title = `${j.nombre}: ${j.puntos} pts`;
                div.style.backgroundColor = j.color;
                div.style.left = `${x + off.x}px`;
                div.style.top  = `${y + off.y}px`;
                contenedor.appendChild(div);
            });
        }

        function renderizarTarjetas() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            const jugadores = obtenerJugadores();

            if (!jugadores.length) {
                container.innerHTML = '<p class="text-muted small mb-0 ps-1">Sin jugadores en la partida.</p>';
                return;
            }

            [...jugadores].sort((a, b) => b.puntos - a.puntos).forEach(j => {
                const vueltas = Math.trunc(j.puntos / POSICIONES.length);
                const card = document.createElement('div');
                card.className = 'player-card-avance';
                card.style.setProperty('--color', j.color);
                card.innerHTML = `
                    <span class="player-dot"></span>
                    <span class="player-name">${j.nombre}</span>
                    <span class="player-pts">${j.puntos}</span>
                    <span class="player-vueltas">(${vueltas})</span>`;
                container.appendChild(card);
            });
        }

        function render() {
            renderizarTarjetas();
            renderizarFichas();
        }

        window.addEventListener('load', () => {
            const mapa = document.getElementById('mapa');
            if (mapa.complete) { ajustarMapaMaximo(); render(); }
            else mapa.addEventListener('load', () => { ajustarMapaMaximo(); render(); });
        });
        window.addEventListener('resize', ajustarMapaMaximo);
        // Refresca cuando puntos.html actualiza localStorage desde otra pestaña
        window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) render(); });
    </script>
</body>
</html>
