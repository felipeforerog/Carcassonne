<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carcassonne - Avance</title>
    <link rel="icon" type="image/png" href="../img/favicon-c.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .page-shell {
            min-height: 100svh;
            padding: 1rem !important;
            background: #f8f9fa;
        }

        .avance-layout {
            min-height: calc(100svh - 2rem);
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 1rem;
        }

        .cards-section {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 1rem;
            padding: 1rem;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: .75rem;
        }

        .image-section {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 1rem;
            background: #f8f9fa;
        }

        #mapa {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            transform-origin: center center;
            object-fit: contain;
        }

        .casilla-dev {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(220, 38, 38, 0.75);
            border: 2px solid #fff;
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .page-shell {
                padding: .75rem !important;
            }

            .avance-layout {
                min-height: calc(100svh - 1.5rem);
            }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-3 px-3 px-md-4 page-shell">
        <div class="avance-layout">
            <section class="cards-section">
                <div class="cards-grid" id="cardsContainer"></div>
            </section>
            <section class="image-section">
                <img id="mapa" src="../img/mapaPuntos.png" alt="Mapa">
            </section>
        </div>
    </div>

    <script>
        const NAT_W = 1460;
        const NAT_H = 1014;

        const POSICIONES = [
            {x:1317,y:843},{x:1098,y:869},{x:959,y:854},{x:809,y:859},{x:677,y:852},
            {x:547,y:866},{x:409,y:871},{x:256,y:893},{x:117,y:834},{x:97,y:685},
            {x:90,y:563},{x:98,y:421},{x:96,y:292},{x:95,y:140},{x:216,y:89},
            {x:336,y:83},{x:452,y:75},{x:566,y:79},{x:678,y:89},{x:786,y:94},
            {x:899,y:95},{x:1006,y:87},{x:1119,y:97},{x:1218,y:84},{x:1364,y:80},
            {x:1395,y:199},{x:1359,y:306},{x:1223,y:333},{x:1124,y:317},{x:1028,y:324},
            {x:931,y:338},{x:831,y:329},{x:726,y:335},{x:612,y:326},{x:523,y:325},
            {x:423,y:317},{x:327,y:352},{x:294,y:446},{x:352,y:540},{x:450,y:578},
            {x:549,y:580},{x:647,y:520},{x:753,y:515},{x:853,y:548},{x:952,y:509},
            {x:1052,y:514},{x:1163,y:510},{x:1266,y:492},{x:1373,y:536},{x:1360,y:655}
        ];

        function ajustarMapaMaximo() {
            const mapa = document.getElementById('mapa');
            const contenedor = document.querySelector('.image-section');
            if (!mapa || !contenedor || !mapa.naturalWidth) return;

            const contW = contenedor.clientWidth;
            const contH = contenedor.clientHeight;
            const escala = Math.min(contW / NAT_H, contH / NAT_W);

            mapa.style.width  = `${NAT_W * escala}px`;
            mapa.style.height = `${NAT_H * escala}px`;

            renderizarCasillasDev();
        }

        // Convierte coordenadas originales (sin rotar) a posicion en pantalla dentro de image-section
        function coordAPantalla(px, py) {
            const mapa = document.getElementById('mapa');
            const contenedor = document.querySelector('.image-section');
            const rMapa = mapa.getBoundingClientRect();
            const rCont = contenedor.getBoundingClientRect();

            // getBoundingClientRect incluye el CSS rotate(-90deg):
            //   rMapa.width  = NAT_H * escala
            //   rMapa.height = NAT_W * escala
            // Mapeo 90° CCW: punto (px,py) en imagen original →
            //   x_visual = 1 - py / NAT_H
            //   y_visual = px / NAT_W
            const x = (rMapa.left - rCont.left) + (1 - py / NAT_H) * rMapa.width;
            const y = (rMapa.top  - rCont.top)  + (px / NAT_W) * rMapa.height;
            return { x, y };
        }

        // Modo desarrollador: pinta los 50 círculos numerados
        function renderizarCasillasDev() {
            const contenedor = document.querySelector('.image-section');
            contenedor.querySelectorAll('.casilla-dev').forEach(el => el.remove());

            POSICIONES.forEach((pos, i) => {
                const { x, y } = coordAPantalla(pos.x, pos.y);
                const div = document.createElement('div');
                div.className = 'casilla-dev';
                div.textContent = i;
                div.style.left = `${x}px`;
                div.style.top  = `${y}px`;
                contenedor.appendChild(div);
            });
        }

        window.addEventListener('load', ajustarMapaMaximo);
        window.addEventListener('resize', ajustarMapaMaximo);
    </script>
</body>
</html>
