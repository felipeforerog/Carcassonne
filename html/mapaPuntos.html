<!DOCTYPE html>
<html lang="es">
<head>

    <style>
	html,
	body {
		height: 100%;
		margin: 0;
	}
	.app-container {
		height: 100vh;
		display: flex;
	}
	.legend-panel-L {
		border-right: 1px solid #dee2e6;
		background-color: #EBF6F9;
		overflow-y: auto;
	}
	.legend-panel-Ljugadores {
		width: 230px;
		min-width: 230px;
		padding: 18px;
		background-color: #;
		overflow-y: auto;
	}
	.legend-panel-R {
		width: 230px;
		min-width: 230px;
		padding: 10px;
		border-left: 1px solid #dee2e6;
		background-color: #EBF6F9;

		display: flex;
		justify-content: center;
		align-items: center;
	}
	.imagen-lateral {
		height: 18%;
		width: auto;
		transform: rotate(-90deg);
	}
	.image-panel {
		flex: 1;
		display: flex;
		justify-content: center;
		align-items: center;
		overflow: hidden;
		background-color: #ffffff;
		position: relative;
	}
	.image-panel img {
		width: 100%;
		height: 100%;
	}
	#mapaContainer {
		position: relative;
		/*border: 3px solid red;*/
		display: inline-block;
	}
	#mapa {
		display: block;
	}
	.player-item {
		padding: 8px;
		margin-bottom: 8px;
		border-radius: 6px;
		background-color: white;
		border: 1px solid #dee2e6;
	}
	.ficha {
		position: absolute;
		width: 25px;
		height: 25px;
		border-radius: 50%;
		border: 2px solid white;
		transform: translate(-50%, -50%);
		/*box-shadow: 0 0 0 2px black, 0 0 12px rgba(0,0,0,0.5);*/
		animation: pulsoFicha 1.5s infinite;
	}
	.ficha::after {
		content: "";
		position: absolute;
		inset: 0;
		border-radius: 50%;
		animation: haloFicha 1.5s infinite;
	}
	@keyframes pulsoFicha {
		0% { transform: translate(-50%, -50%) scale(1); }
		50% { transform: translate(-50%, -50%) scale(1.25); }
		100% { transform: translate(-50%, -50%) scale(1); }
	}
	@keyframes haloFicha {
		0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.9); }
		100% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
	}
	.punto-prueba {
		position: absolute;
		width: 12px;
		height: 12px;
		background-color: lime;
		border: 1px solid black;
		border-radius: 50%;
		transform: translate(-50%, -50%);
		z-index: 1000;
	}
	.etiqueta-punto {
		position: absolute;
		font-size: 10px;
		font-weight: bold;
		color: black;
		transform: translate(8px, -8px);
		z-index: 1001;
	}
    </style>

	</div>
    <!-- Tablero -->

			<img id="mapa" src="../img/mapaPuntos.jpg" alt="Mapa">

//lista de posiciones o casillas usadas
let casillasEnUso = []

//renderiza la informacion que viene de la URL sobre los jugadores 
window.addEventListener("load", () => {
    renderizarLeyenda();
    crearFichas();
    renderizarJugadores();
});
window.addEventListener("resize", () => {
    renderizarJugadores();
});

//obtiene info de jugadores que viene en la URL
function obtenerJugadores() {
    const params = new URLSearchParams(window.location.search);
    const jugadoresParam = params.get("jugadores");

    if (!jugadoresParam) {
        return [];
    }

    try {
        return JSON.parse(
            decodeURIComponent(jugadoresParam)
        );
    }
    catch(error) {
        console.error(error);
        return [];
    }
}

//pinta las fichas de los jugadores en el mapa
function renderizarJugadores() {
	let index = 0
	casillasEnUso = []
    const jugadores = obtenerJugadores();
    jugadores.forEach(jugador => {
		
        const ficha = document.getElementById("jugador_" + jugador.id);

        if (!ficha) { return; }
		
		const casilla = obtenerCasilla(jugador.puntos);
		casillasEnUso.push(casilla)
		let index = contarRepeticiones(casillasEnUso, casilla);
		moverFicha(ficha.id, casilla, index);
    });
}
function contarRepeticiones(lista, numeroBuscado) {
    return lista.filter(num => num === numeroBuscado).length;
}

//obtiene la casilla o posicion del mapa, segun los puntos que tenga el jugador.
/*Ejemplos: 0 -> casilla 0 , 49 -> casilla 49 , 50  -> casilla 0 , 51 -> casilla 1
            99 -> casilla 49 , 100 -> casilla 0 , 209 -> casilla 9                 */
function obtenerCasilla(puntos) {
	if(puntos < 0) return 0
    const totalCasillas = POSICIONES.length;
    //return ((puntos % totalCasillas) + totalCasillas) % totalCasillas;
	return puntos % totalCasillas;
}

//mueve la ficha a la posicion deseada
function moverFicha(idFicha, casilla, indice) {
	const escalaX = mapaContainer.clientWidth / ANCHO_REFERENCIA;
    const escalaY = mapaContainer.clientHeight / ALTO_REFERENCIA;
    
	const ficha = document.getElementById(idFicha);
	
    ficha.style.left = ((POSICIONES[casilla].x * escalaX) + offset(indice).x) + "px";
    ficha.style.top  = ((POSICIONES[casilla].y * escalaX) + offset(indice).y) + "px";
}
//offset de posicion
function offset(i){
	const offsets = [
		{x:0,y:0},
		{x:18,y:0},
		{x:-18,y:0},
		{x:0,y:18},
		{x:0,y:-18},
		{x:18,y:18},
		{x:18,y:-18},
		{x:-18,y:18},
		{x:-18,y:-18}
	];
	return offsets[i];
}

//crea las fichas de juego
function crearFichas() {	
    const mapaContainer = document.getElementById("mapaContainer");
    const jugadores = obtenerJugadores();

    jugadores.forEach(jugador => {
        const ficha = document.createElement("div");
        ficha.id = "jugador_" + jugador.id;
        ficha.className = "ficha";
		ficha.style.backgroundColor = jugador.color;
        mapaContainer.appendChild(ficha);
    });
}

//renderiza leyenda izquieda
function renderizarLeyenda() {

    const contenedor = document.getElementById("listaJugadores");
    contenedor.innerHTML = "";

    const jugadores = obtenerJugadores();
    jugadores.forEach(jugador => {
	
		const vueltas = Math.trunc(jugador.puntos / POSICIONES.length)
	
        const item = document.createElement("div");
        item.className = "player-item";
        item.innerHTML = `
            <div class="d-flex align-items-center justify-content-between">
				<div>
					<span style="
					display:inline-block;
					width:20px;
					height:20px;
					border-radius:50%;
					background:${jugador.color};
					border:1px solid #000;
					margin-right:8px;">
					</span> 
					<span class="fs-5">${jugador.nombre}
				</div>
				<div><span class="h4" class="float-end">${jugador.puntos}</span> (${vueltas})</div>
			</div>
        `;
        contenedor.appendChild(item);
    });
}
</script>
