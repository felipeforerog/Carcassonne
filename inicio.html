<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carcassonne</title>
	<link rel="icon" type="image/png" href="/img/favicon-c.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    html, body {
		height: 100%;
		margin: 0;
		background-color: #f5f5f5;
	}
	.page-container {
		height: 100vh;
		padding: 40px;
	}
	.game-cover {
		position: relative;
		width: 100%;
		height: 100%;
		overflow: hidden;
		border-radius: 20px;
		box-shadow: 0 8px 25px rgba(0,0,0,.15);
	}
	.background-image {
		width: 100%;
		height: 100%;
		object-fit: cover;
		display: block;
	}
	.title-image {
		position: absolute;
		top: 30px;
		left: 30px;
		width: 320px;
		max-width: 40%;
		z-index: 10;
	}
	.hotspot {
		position: absolute;
		width: 2.1%;
		height: 5.1%;
		left: 36.45%;
		top: 48.1%;
		border-radius: 12px;
		animation: heartbeat 3s infinite;
		cursor: pointer;
	}
	.hotspot::before {
		content: "";
		position: absolute;
		inset: 0;

		border-radius: inherit;

		background: rgba(255,255,255,.12);

		box-shadow:
			0 0 20px rgba(255,255,255,.5),
			0 0 40px rgba(255,255,255,.3);
	}
	@keyframes heartbeat {
		0% { transform: scale(1); }
		14% { transform: scale(1.08); }
		28% { transform: scale(1); }
		42% { transform: scale(1.12); }
		70% { transform: scale(1); }
		100% { transform: scale(1); }
	}
	.pulse-tile{
		width:100%;
		height:100%;
		background-image:url("img/escudo2.png");
		background-size:cover;
		animation:heartbeat 3s infinite;
	}
    </style>
</head>
<body>
    <div class="page-container">
        <div class="game-cover">
            <!-- Imagen principal -->
            <img src="img/portada.jpg" alt="Fondo" class="background-image">
            <!-- Logo o título -->
            <img src="img/carcassonne_logo1.png" alt="Título del juego" class="title-image">
			<!-- Escudo pulsante -->
			<a href="html/juego.html" class="hotspot">
				<div class="pulse-tile"></div>
			</a>
        </div>
    </div>
</body>
</html>
